<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acme CRM</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Ctext x='16' y='22' font-family='Segoe UI,sans-serif' font-size='15' font-weight='700' fill='white' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="crm">
  <header class="topbar">
    <div class="brand">
      <span class="logo">CRM</span>
      <h1>Acme CRM</h1>
    </div>
    <span class="pill" id="status"><i></i><span>Waiting for ADTCallControl…</span></span>
    <div class="test-tools" title="For testing that CRM problems don't affect ADTCallControl">
      <button type="button" class="secondary" id="freezeBtn">Freeze CRM (60s)</button>
      <button type="button" class="danger" id="crashBtn">Crash CRM</button>
    </div>
  </header>

  <main class="page">
    <section class="card screen-pop">
      <h2>Screen pop</h2>
      <p class="muted" id="popEmpty">The latest voice event from ADTCallControl shows here.</p>
      <div id="popBody" hidden>
        <p class="pop-message" id="popMessage"></p>
        <dl class="pop-meta" id="popMeta"></dl>
      </div>
    </section>

    <section class="card log-card">
      <div class="card-head">
        <h2>Received voice events</h2>
        <button type="button" class="link" id="clearLog">Clear</button>
      </div>
      <ol id="log" class="log" data-empty="No voice events yet."></ol>
    </section>
  </main>

  <script src="/shared/config.js"></script>
  <script src="/shared/log.js"></script>
  <script src="/shared/bus-client.js"></script>
  <script src="app.js"></script>
</body>
</html>
